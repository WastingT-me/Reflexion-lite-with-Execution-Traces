name: Agent-ready task
description: A bounded task suitable for autonomous implementation
title: "[agent] "
labels: []
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: One observable outcome.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Relevant files, behavior, and constraints.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: A checkable list; each item must be independently verifiable.
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Required checks
      description: Exact commands or test scenarios required before completion.
    validations:
      required: true
  - type: textarea
    id: allowed_files
    attributes:
      label: Expected or allowed files
      description: Bound the likely change surface. Explain any deviation in the PR.
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
      description: Adjacent work that must not be included.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and blockers
      description: Other issues, artifacts, credentials, hardware, or unresolved decisions.
